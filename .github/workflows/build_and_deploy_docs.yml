name: Build and Deploy Docs

# The pages live in rdnajac/PalomeroLab under docs/. This workflow checks out
# that repository, then checks out this repository into it, so that the
# docs_dir path ../docs in mkdocs.yml resolves.
#
# PALOMEROLAB_TOKEN must be a repository secret. The token needs read access to
# the private repository rdnajac/PalomeroLab.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the pages repository
        uses: actions/checkout@v4
        with:
          repository: rdnajac/PalomeroLab
          token: ${{ secrets.PALOMEROLAB_TOKEN }}
          path: palomerolab

      - name: Checkout this repository into it
        uses: actions/checkout@v4
        with:
          path: palomerolab/how-to

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: palomerolab/how-to

      - name: Deploy documentation
        run: mkdocs gh-deploy --force
        working-directory: palomerolab/how-to
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
